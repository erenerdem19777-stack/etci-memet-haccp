/* VOICE: kasap tezgâhındaki kontrol panosu – kısa, net, iş başında okunur
   IDEA: kasap fişi + termometre ibresi: her kayıt bir fiş, sonuç bir damga (UYGUN / LİMİT DIŞI)
   PICTURE: Bugün ekranında 6 ölçüm noktası × 3 vakit damga ızgarası – günün sıcaklık haritası
   COLOUR and TYPE: et kırmızısı #9b1c1c baskın, beyaz fayans zemin, çelik gri destek, onay yeşili yalnız sonuçta; Barlow Semi Condensed başlık, Barlow metin

:root{color-scheme:light dark;
--bg:light-dark(#f6f5f3,#141414);--card:light-dark(#ffffff,#1e1e1e);--ink:light-dark(#1b1b1b,#efeeec);--mut:light-dark(#6b6b6b,#a3a3a3);

--warn:light-dark(#8a5a00,#e8b14a);--warnbg:light-dark(#fff3d6,#3a2d10);--steel:light-dark(#4a5056,#b9bec4)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0;line-height:1.1}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
main{max-width:760px;margin:0 auto;padding:0 14px 96px}
header.top{background:var(--red);color:#fff;padding:14px 16px 12px}
header.top .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header.top small{opacity:.85;font-size:13px}
.daybar{display:flex;gap:8px;align-items:center}
.daybar input{background:#fff;color:#1b1b1b;border:0;border-radius:8px;padding:6px 8px;font:inherit;font-size:15px;min-height:38px}
.banner{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.sec{margin-top:18px}
.sec>h2{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h2 small{font:500 14px Barlow,system-ui,sans-serif;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi b{font:700 28px "Barlow Semi Condensed",system-ui,sans-serif}.kpi span{font-size:13px;color:var(--mut)}
.kpi.bad b{color:var(--red)}.kpi.good b{color:var(--ok)}
.tgrid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.tgrid .h{font-size:12px;color:var(--mut);text-align:center;align-self:end}
.tgrid .n{font-size:14px;font-weight:600;align-self:center;line-height:1.2}
.tgrid .n small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.stamp{min-height:46px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--mut);font:600 15px "Barlow Semi Condensed",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.stamp.ok{border:2px solid var(--ok);color:var(--ok);background:var(--okbg)}
.stamp.bad{border:2px solid var(--red);color:var(--red);background:var(--redbg)}
.stamp small{font:500 11px Barlow,system-ui,sans-serif}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.item .t{font-weight:600}.item .s{font-size:13px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:600 13px Barlow,system-ui,sans-serif;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--redbg);color:var(--red)}.pill.wait{background:var(--warnbg);color:var(--warn)}.pill.n{background:var(--line);color:var(--ink)}
button,.btn{font:600 16px Barlow,system-ui,sans-serif;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:4px 12px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid light-dark(#1b1b1b,#fff);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{text-align:left;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;border-radius:14px}
.tile b{font:700 18px "Barlow Semi Condensed",system-ui,sans-serif}.tile span{font:400 13px Barlow,system-ui,sans-serif;color:var(--mut)}
.tile.ccp{border-left:6px solid var(--red)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{border:0;border-radius:0;background:transparent;min-height:58px;font:600 13px Barlow,system-ui,sans-serif;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .panel{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px}
.sheet .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;position:sticky;top:-16px;background:var(--bg);padding:6px 0}
label.f{display:block;margin:10px 0 0;font-size:14px;font-weight:600}
label.f>span{display:block;margin-bottom:4px}label.f>span.numw{display:flex;margin-bottom:0}
input,select,textarea{width:100%;font:16px Barlow,system-ui,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:76px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 auto;min-height:40px;font-size:15px}.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.result{margin-top:14px;padding:12px;border-radius:12px;font-weight:600;display:none}
.result.ok{display:block;background:var(--okbg);color:var(--ok)}.result.bad{display:block;background:var(--redbg);color:var(--red)}.result.wait{display:block;background:var(--warnbg);color:var(--warn)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk .seg{flex:none;width:132px}.chk .seg button{min-height:36px;padding:2px 8px}
.numw{display:flex;gap:6px;align-items:stretch}.numw input{flex:1 1 auto;min-width:0}.numw .pm{flex:0 0 auto;min-width:52px;font-weight:700;font-size:17px;padding:0 8px}
.kfrow{flex-wrap:wrap}.kfrow>span{flex:1 1 220px}.kfa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}.chk .kfseg{width:auto}.kfseg button{min-width:58px}.seg button.badon{background:var(--red);border-color:var(--red);color:#fff}.kfsec.due{border-left:4px solid var(--red)}.kfgrid .card{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border-radius:99px;min-height:38px;font-size:14px;padding:4px 12px}.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.chain{border-left:3px solid var(--red);padding-left:12px;margin-left:6px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;display:none;max-width:90vw}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mut);font-size:14px}

.filebtn{display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.aibox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
@media(max-width:420px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
@media(prefers-reduced-motion:no-preference){.sheet.open .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}

function memDB(init, persist){
  const store = init || {}, subs = [];
  const clone = o => JSON.parse(JSON.stringify(o));
  const merge = (a,b) => { for(const k in b){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) merge(a[k],b[k]); else a[k]=clone(b[k]); } return a; };
  const snap = (p) => ({id:p.split('/').pop(), exists:!!store[p], data:()=>store[p]?clone(store[p]):undefined, metadata:{fromCache:false,hasPendingWrites:false}});
  const fire = () => subs.forEach(f=>f());
  const docRef = p => ({id:p.split('/').pop(), path:p,
    get: async()=>snap(p), set: async d=>{store[p]=clone(d); if(persist) await persist.put(p,store[p]); fire();},
    update: async d=>{ if(!store[p]) throw {code:'invalid_argument',message:'missing'}; merge(store[p],d); if(persist) await persist.put(p,store[p]); fire(); },
    delete: async()=>{delete store[p]; if(persist) await persist.del(p); fire();},
    onSnapshot:(n)=>{ const f=()=>n(snap(p)); subs.push(f); setTimeout(f,0); return ()=>{}; }});
  const q = (c,ord,lim) => ({ where(){return this;}, orderBy:(f,dir)=>q(c,[f,dir],lim), limit:n=>q(c,ord,n),
    get: async()=>run(c,ord,lim), onSnapshot:(n)=>{ const f=()=>n(run(c,ord,lim)); subs.push(f); setTimeout(f,0); return ()=>{}; },
    doc: id=>docRef(c+'/'+(id||uid())), add: async d=>{ const r=docRef(c+'/'+uid()); await r.set(d); return r; }, path:c });
  const run = (c,ord,lim) => { let docs = Object.keys(store).filter(p=>p.startsWith(c+'/')&&p.split('/').length===c.split('/').length+1).map(snap);
    if(ord){ docs.sort((a,b)=>{const x=a.data()[ord[0]],y=b.data()[ord[0]]; return (x>y?1:x<y?-1:0)*(ord[1]==='desc'?-1:1);}); }
    if(lim) docs=docs.slice(0,lim); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}; };
  return { doc: docRef, collection: c => q(c) };
}

function nextLot(prefix, k, list){ const re=new RegExp('^'+prefix.replace(/[-]/g,'\\-')+'-'+yymmdd(k)+'-(\\d+)$'); let n=0; for(const x of list){ const m=(x.lot||x.icLot||'').match(re); if(m) n=Math.max(n,+m[1]); } return prefix+'-'+yymmdd(k)+'-'+String(n+1).padStart(2,'0'); }
function dayCounts(k){
  const d=D(k); let bad=0, total=0;
  const sec=['sicaklik','kabul','uretim','ekipman','hijyen','sevkiyat','dis','per'];
  for(const s of sec) for(const e of vals(d[s])){ total++; if(e.sonuc==='bad'||e.sonuc3==='bad'||e.teslimSonuc==='bad') bad++; }
  return {bad,total};
}
function ccp3Pending(){ return allUretim().filter(u=>u.sonuc3==='wait' && dayDiff(u._day,S.day)<=3 && dayDiff(u._day,S.day)>=0); }
function teslimPending(){ return allSevk().filter(s=>s.teslimC===null||s.teslimC===undefined).filter(s=>dayDiff(s._day,S.day)<=2&&dayDiff(s._day,S.day)>=0); }
const openDF = () => S.df.filter(x=>!x.kapanis);

function feedRows(k){
  const d=D(k), rows=[];

  for(const e of vals(d.kabul)) rows.push([e.ts,e.tur==='Karkas'?'★CCP-1 Karkas kabul':'Mal kabul',`${e.tedarikci||''} · ${e.urun||''} · ${e.icLot||''}`,`${e.sicaklik??'—'} °C · ${e.karar}`,e.sonuc,e.df,e.ad,e.foto]);
  for(const e of vals(d.uretim)) rows.push([e.ts,'Üretim ★CCP-2/3',`${e.urun} · ${e.lot} · ${e.kg||''} kg`,`ürün ${e.tmax??'—'} °C · dolap ${e.dk??'—'} dk${e.ertesiC!=null?' · ertesi '+e.ertesiC+' °C':''}`,e.sonuc3==='bad'||e.sonuc==='bad'?'bad':e.sonuc3==='wait'?'wait':'ok',e.df,e.ad,e.foto]);
  for(const e of vals(d.ekipman)) rows.push([e.ts,'Ekipman',e.kontrol,`${e.kiyma} / ${e.pres} / ${e.bicak}`,e.sonuc,e.df,e.ad]);
  for(const e of Object.values(d.hijyen||{})) rows.push([e.ts,'Hijyen','Günlük kontrol',`${e.items.filter(x=>x==='Evet').length}/${HIJYEN.length} evet`,e.sonuc,e.df,e.ad]);
  for(const e of vals(d.per)) rows.push([e.ts,'Periyodik kontrol',e.gorevAd,`${e.oku!=null?'okunan '+e.oku+' °C · ':''}${e.not||''}${e.kat?' · '+e.kat:''}`,e.sonuc,e.df,e.ad,e.foto]);
  for(const e of vals(d.dis)) rows.push([e.ts,'Dış denetim / rapor',`${e.tur} · ${e.firma||''}`,`${e.ozet||''}${e.rapNo?' · rapor '+e.rapNo:''}`,e.sonuc,e.df,e.ad,e.foto]);
  for(const e of vals(d.sevkiyat)) rows.push([e.ts,'Sevkiyat',`${e.sube} · ${e.lot} · ${e.miktar||''}`,`çıkış ${e.cikisC} °C${e.teslimC!=null?' · teslim '+e.teslimC+' °C':''}`,e.sonuc==='bad'||e.teslimSonuc==='bad'?'bad':'ok',e.df,e.ad,e.foto]);
  return rows.sort((a,b)=>(b[0]||0)-(a[0]||0));
}

function traceFind(q){
  q=q.trim().toUpperCase(); if(!q) return null;
  const U=allUretim(), K=allKabul(), Sv=allSevk();
  const burger=U.find(u=>(u.lot||'').toUpperCase()===q);
  const kab=K.find(x=>(x.icLot||'').toUpperCase()===q||(x.tedLot||'').toUpperCase()===q);
  if(burger){ const karkas=(burger.karkasLots||[]).map(l=>K.find(x=>x.icLot===l)||{icLot:l}); const sevk=Sv.filter(s=>s.lot===burger.lot); return {tip:'burger',burger,karkas,sevk}; }
  if(kab&&kab.tur==='Karkas'){ const burgers=U.filter(u=>(u.karkasLots||[]).includes(kab.icLot)); const sevk=Sv.filter(s=>burgers.some(b=>b.lot===s.lot)); return {tip:'karkas',kab,burgers,sevk}; }
  if(kab){ const lot=kab.icLot; const sevk=Sv.filter(s=>s.lot===lot); return {tip:'fason',kab,sevk}; }
  return {tip:'yok'};
}

function vDenetim(){
  const k=S.day, from=addDays(k,-29); let n=0,c1=0,c1b=0,c2=0,c2b=0,c3=0,c3b=0,onayli=0;
  for(const dk in S.days){ if(dk<from||dk>k) continue; n++; const d=S.days[dk]; if(d.onay) onayli++;
    for(const e of vals(d.kabul)) if(e.tur==='Karkas'){ c1++; if(e.sonuc==='bad') c1b++; }
    for(const e of vals(d.sicaklik)) if(['parc','kofte','urun'].includes(e.nokta)){ c2++; if(e.sonuc==='bad') c2b++; }
    for(const e of vals(d.uretim)){ c2++; if(e.sonuc==='bad') c2b++; c3++; if(e.sonuc3==='bad') c3b++; }
    for(const e of vals(d.sicaklik)) if(e.nokta==='d18'){ c3++; if(e.sonuc==='bad') c3b++; } }
  const ek5Done = TK.filter(x=>x[1]&&S.ek5[x[0]]&&S.ek5[x[0]].m).length, ek5Tot=TK.filter(x=>x[1]).length;

function sha256(str){ const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str), l=b.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(b); m[l]=0x80; const dv=new DataView(m.buffer); dv.setUint32(n-4,l*8); dv.setUint32(n-8,Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const w=new Uint32Array(64); const r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let o=0;o<n;o+=64){ for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4); for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0; }
    let [a,bb,c,d,e,f,g,h]=H; for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0; h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=bb; bb=a; a=(t1+t2)>>>0; }
    H=H.map((x,i)=>(x+[a,bb,c,d,e,f,g,h][i])>>>0); }
  return H.map(x=>x.toString(16).padStart(8,'0')).join(''); }
const kNorm = s => String(s||'').trim().toLocaleLowerCase('tr').replace(/\s+/g,'');
const pwHash = (kadi,pw,salt) => sha256(salt+':'+kNorm(kadi)+':'+pw+':etcimemet');

  if(tip==='df') return S.df.filter(x=>x.tarih>=from&&x.tarih<=to).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const out=[]; for(const k of Object.keys(S.days)){ const d=S.days[k]; const list=tip==='hijyen'?Object.values(d.hijyen||{}):vals(d[tip]);
    for(const e of list){ const dt=(tip==='dis'&&e.tarihR)||(tip==='per'&&e.tarihY)||k; if(dt>=from&&dt<=to) out.push({...e,_day:k,_dt:dt}); } }
  return out.sort((a,b)=>a._dt<b._dt?1:a._dt>b._dt?-1:(b.ts||0)-(a.ts||0)); }
const isBad = row => row.some(c=>c&&typeof c==='object'&&c.r==='bad');
function vTip(){
  const tip=S.tip, T=TIPLER[tip]; if(!T){ S.view='kayit'; return vKayit(); }
  const [from,to,per]=tpRange(); const rows=tipRows(tip,from,to).map(e=>({e,v:T.row(e)})); const bad=rows.filter(x=>isBad(x.v)).length; const tp=S.tp||{p:'ay'};
  const cell=c=>c&&typeof c==='object'&&'r' in c?pill(c.r):esc(c??'');
  const hasF=rows.some(x=>x.e.foto&&x.e.foto.length);
  return `<section class="sec"><button class="sm ghost" data-go="kayit">← Kayıt</button>
   <h2 style="margin-top:8px">${esc(T.ad)} <small>${rows.length} kayıt${bad?' · '+bad+' uygunsuz':''}</small></h2>
   <div class="row" style="margin:8px 0"><button class="pri" data-new="${tip}">+ Yeni kayıt</button></div>
   <div class="card"><div class="seg" id="tpSeg">${[['gun','Bugün'],['ay','Bu ay'],['gecen','Geçen ay'],['ara','Tarih aralığı']].map(([k,l])=>`<button class="${tp.p===k?'on':''}" data-tp="${k}">${l}</button>`).join('')}</div>
   ${tp.p==='ara'?`<div class="grid g2"><label class="f"><span>Başlangıç</span><input type="date" id="tpFrom" value="${esc(tp.from||addDays(S.day,-29))}"></label><label class="f"><span>Bitiş</span><input type="date" id="tpTo" value="${esc(tp.to||S.day)}"></label></div>`:''}
   <p class="muted" style="margin:8px 0">Dönem: <b>${esc(per)}</b></p>
   <div class="row"><button id="tpCsv">Excel’e aktar</button></div>${S.tpMsg?`<div class="aibox">${esc(S.tpMsg)}</div>`:''}</div></section>
  <section class="sec"><div class="card scroll">${rows.length?`<table><thead><tr>${hasF?'<th>Foto</th>':''}${T.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,300).map(x=>`<tr>${hasF?`<td>${thumbs(x.e.foto)}</td>`:''}${x.v.map(cell).join('')}</tr>`).join('')}</tbody></table>${rows.length>300?'<p class="muted">İlk 300 kayıt gösteriliyor; PDF ve Excel’de tamamı var.</p>':''}`:'<p class="muted">Bu dönemde kayıt yok.</p>'}</div></section>`;
}
async function tipExport(kind){
  const tip=S.tip, T=TIPLER[tip]; const [from,to,per]=tpRange(); const rows=tipRows(tip,from,to).reverse().map(e=>T.row(e));
  const fbase=`EtciMemet_${T.ad.split(' (')[0].replace(/[^A-Za-z0-9ğüşöçıİĞÜŞÖÇ]+/g,'_')}_${per.replace(/[^A-Za-z0-9ğüşöçıİĞÜŞÖÇ]+/g,'_')}`;
  if(kind==='csv'){ const txt=c=>c&&typeof c==='object'&&'r' in c?(c.r==='ok'?'Uygun':c.r==='bad'?'Uygun değil':c.r==='wait'?'Bekliyor':''):String(c??'');
    const csv='﻿'+[T.heads,...rows.map(r=>r.map(txt))].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    try{ S.tpMsg=await saveFile(new Blob([csv],{type:'text/csv'}),fbase+'.csv',T.ad,'Excel (CSV)'); }catch(e){ S.tpMsg=e&&e.code==='declined'?'Kaydetme iptal edildi.':'Dosya kaydedilemedi.'; } render(); return; }
  S.tpMsg='PDF hazırlanıyor…'; render();
  const E=s=>esc(s??''); const cell=c=>c&&typeof c==='object'&&'r' in c?RS(c.r):E(c);
  const bad=rows.filter(isBad).length;
  const head=`<div class="hd"><div><b>ETÇİ MEMET – MERKEZ ÜRETİM TESİSİ</b><br>${E(T.ad)}</div><div class="r">EM-HACCP-001 · Rev.04<br>Dönem: ${E(per)}</div></div>`;
  const per_page=24, pages=[];
  for(let i=0;i<Math.max(rows.length,1);i+=per_page){ const ch=rows.slice(i,i+per_page); const first=i===0, last=i+per_page>=rows.length;
    pages.push(`<section class="page">${head}${first?`<h1>${E(T.ad)}</h1><p>Dönem: <b>${E(per)}</b> (${trDate(from)} – ${trDate(to)}) · Toplam kayıt: <b>${rows.length}</b> · Uygunsuz: <b>${bad}</b> · Rapor tarihi: ${trDate(today())} ${nowHM()}</p>`:''}
    ${ch.length?`<table><thead><tr>${T.heads.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${ch.map(r=>`<tr>${r.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="none">Bu dönemde kayıt yok.</p>'}
    ${last?'<div class="sign"><div>Kontrol eden<br><br>Ad Soyad / İmza</div><div>Sorumlu Yönetici<br><br>Ad Soyad / İmza</div><div>Tarih</div></div>':''}</section>`); }
  const css=(await buildReport(from,from,'',false,true)).css;
  try{ const blob=await makePdf({css,pages},'landscape'); S.tpMsg=await saveFile(blob,fbase+'.pdf',T.ad,'PDF'); }
  catch(e){ console.warn(e); S.tpMsg=e&&e.code==='declined'?'Kaydetme iptal edildi.':(e&&String(e.message||e).toLowerCase().includes('cancel'))?'Paylaşım iptal edildi.':'PDF oluşturulamadı.'; }
  render(); }

function openForm(o){
  const st={...(o.init||{})};
  const panel=$('#panel');
  const fieldHTML=f0=>{ const f={...f0,o:typeof f0.o==='function'?f0.o(st):f0.o}; if(f.show&&!f.show(st)) return ''; const v=st[f.k]??'';
    if(f.t==='seg') return `<div class="f" style="margin-top:10px"><span style="font-weight:600;font-size:14px;display:block;margin-bottom:4px">${f.l}</span><div class="seg" data-k="${f.k}">${f.o.map(x=>`<button type="button" class="${v===x?'on':''}" data-val="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;
    if(f.t==='sel') return `<label class="f"><span>${f.l}</span><select data-k="${f.k}"><option value="">— seçin —</option>${f.o.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
    if(f.t==='chips') return `<div class="f" style="margin-top:10px"><span style="font-weight:600;font-size:14px;display:block;margin-bottom:4px">${f.l}</span><div class="chips" data-k="${f.k}">${f.o.map(x=>`<button type="button" class="chip ${(v||[]).includes(x)?'on':''}" data-val="${esc(x)}">${esc(x)}</button>`).join('')||'<span class="muted">Son günlerde kabul edilmiş uygun karkas yok</span>'}</div></div>`;
    if(f.t==='check') return `<div>${f.o.map((x,i)=>`<div class="chk"><span style="flex:1">${esc(x)}</span><div class="seg" data-k="${f.k}" data-i="${i}"><button type="button" class="${(v||[])[i]==='Evet'?'on':''}" data-val="Evet">Evet</button><button type="button" class="${(v||[])[i]==='Hayır'?'on':''}" data-val="Hayır">Hayır</button></div></div>`).join('')}</div>`;
    if(f.t==='foto'){ const ph=st.foto||[]; return `<div class="f" style="margin-top:10px"><span style="font-weight:600;font-size:14px;display:block;margin-bottom:4px">${f.l}</span>${ph.length?`<div class="thumbs">${ph.map(p=>`<div class="th"><img src="${esc(p.url)}" alt=""><small>${p.st==='up'?'yükleniyor':p.st==='err'?'saklanamadı':p.st==='yerel'?'yalnız okuma':''}</small></div>`).join('')}</div>`:''}<div class="row" style="margin-top:8px"><span class="btn filebtn">${ph.length?'Fotoğraf ekle':'Fotoğraf çek / seç'}<input type="file" accept="image/*" capture="environment" multiple data-foto aria-label="Fotoğraf çek veya seç"></span>${f.ai&&aiOK&&ph.length?`<button type="button" class="pri" data-ai ${st._aiBusy?'disabled':''}>${st._aiBusy?'Okunuyor…':'Fotoğraftan doldur'}</button>`:''}</div>${st._aiMsg?`<div class="aibox">${esc(st._aiMsg)}</div>`:''}</div>`; }
    if(f.t==='area') return `<label class="f"><span>${f.l}</span><textarea data-k="${f.k}">${esc(v)}</textarea></label>`;
    if(f.t==='num') return `<label class="f"><span>${f.l}</span><span class="numw"><button type="button" class="pm" aria-label="Eksi / artı">−/+</button><input data-k="${f.k}" type="text" inputmode="decimal" autocomplete="off" value="${esc(v)}" placeholder="${esc(f.ph||'')}"></span></label>`;
    return `<label class="f"><span>${f.l}</span><input data-k="${f.k}" type="${f.t||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"></label>`; };
  const draw=()=>{ const res=o.calc?o.calc(st):null; const needDF=res&&res.ok===false;
    panel.innerHTML=`<div class="ph"><h2>${o.title}</h2><button class="sm ghost" id="fClose">Kapat</button></div>${o.note?`<p class="muted" style="margin:0">${o.note}</p>`:''}
    ${o.fields.map(fieldHTML).join('')}
    <div class="result ${res?(res.ok===true?'ok':res.ok===false?'bad':'wait'):''}" id="fRes">${res?esc(res.msg):''}</div>
    ${needDF?`<label class="f"><span>Düzeltici faaliyet (zorunlu) – ne yaptınız?</span><textarea data-k="df" placeholder="ör. Kapı kapatıldı, ürün ölçüldü 3,8 °C, bakım arandı">${esc(st.df||'')}</textarea></label>`:''}
    <div class="row" style="margin-top:16px"><button class="pri" id="fSave" style="flex:1">Kaydet</button></div>`;
    panel.querySelectorAll('[data-k]').forEach(el=>{ const k=el.dataset.k;
      if(el.classList.contains('seg')&&el.dataset.i!==undefined){ el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const arr=[...(st[k]||[])]; arr[+el.dataset.i]=b.dataset.val; st[k]=arr; draw(); }); }
      else if(el.classList.contains('seg')) el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ st[k]=b.dataset.val; draw(); });
      else if(el.classList.contains('chips')) el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const s=new Set(st[k]||[]); s.has(b.dataset.val)?s.delete(b.dataset.val):s.add(b.dataset.val); st[k]=[...s]; draw(); });
      else { el.oninput=()=>{ st[k]=el.value; const r=o.calc?o.calc(st):null; const box=$('#fRes'); if(box&&r){ box.className='result '+(r.ok===true?'ok':r.ok===false?'bad':'wait'); box.textContent=r.msg; if((r.ok===false)!==!!panel.querySelector('textarea[data-k=df]')){ const f=document.activeElement; const id=f&&f.dataset.k; draw(); const n=id&&panel.querySelector(`[data-k="${id}"]`); if(n){n.focus(); try{n.setSelectionRange(n.value.length,n.value.length);}catch(e){}} } } }; el.onchange=()=>{ if(el.tagName==='SELECT'){ st[k]=el.value; draw(); } }; } });
    $('#fClose').onclick=closeSheet;
    const fi=panel.querySelector('[data-foto]'); if(fi) fi.onchange=async()=>{ const files=[...fi.files]; for(const file of files){ const blob=await shrink(file); const p={url:URL.createObjectURL(blob),blob,st:'up'}; st.foto=[...(st.foto||[]),p]; draw();
        if(assets){ try{ const r=await assets.upload(blob,{type:'image/jpeg'}); p.id=r.id; LOCAL[r.id]=p.url; p.st='ok'; }catch(e){ p.st='err'; } }
        else if(!S.live){ p.id='local'+uid(); LOCAL[p.id]=p.url; p.st='ok'; } else p.st='yerel';
        draw(); } };
    const ab=panel.querySelector('[data-ai]'); if(ab) ab.onclick=async()=>{ st._aiBusy=true; st._aiMsg='Claude belgeleri okuyor (10–40 sn)…'; draw();
      try{ const j=await sampleFn.json((o.aiPrompt||aiPrompt)(st), {images:(st.foto||[]).map(p=>p.blob).filter(Boolean).slice(0,5)}); const extra=o.ai(st,j||{}); st._aiMsg='Fotoğraftan dolduruldu – alanları kontrol edin.'+(extra?' '+extra:''); }
      catch(e){ st._aiMsg=e&&e.code==='not_granted'?'Claude kullanımına izin verilmedi; alanları elle doldurun.':e&&e.code==='rate_limited'?'Çok sık istek; biraz sonra tekrar deneyin.':'Fotoğraf okunamadı; daha net bir fotoğraf çekin veya elle doldurun.'; }
      st._aiBusy=false; draw(); };
    $('#fSave').onclick=async()=>{ if((st.foto||[]).some(p=>p.st==='up')){ toast('Fotoğraf yükleniyor, bekleyin'); return; } const r=o.calc?o.calc(st):null; const miss=o.fields.filter(f=>f.req&&(!f.show||f.show(st))&&(st[f.k]===undefined||st[f.k]===''||st[f.k]===null||(Array.isArray(st[f.k])&&(f.t==='check'?st[f.k].filter(Boolean).length<f.o.length:!st[f.k].length))));
      if(miss.length){ toast('Eksik: '+miss.map(f=>f.l).join(', ')); return; }
      if(r&&r.ok===false&&!(st.df||'').trim()){ toast('Limit dışı: düzeltici faaliyeti yazın'); return; }
      $('#fSave').disabled=true; try{ await o.save(st,r); closeSheet(); toast(r&&r.ok===false?'Kaydedildi · uygunsuzluk açıldı':'Kaydedildi'); } catch(e){ failWrite(e); $('#fSave').disabled=false; } };
  };
  draw(); $('#sheet').classList.add('open');
}

const FORMS = {
  sicaklik(pre){ const vk='Günlük';
    const pn=NOKTA.find(x=>x.k===pre?.nokta);
    openForm({title:'Sıcaklık ölçümü', init:{nokta:pn?pn.ad:'', vakit:vk}, fields:[
      {k:'nokta',l:'Ölçüm noktası',t:'sel',o:NOKTA.map(n=>n.ad),req:true},{k:'foto',l:'Termometre / gösterge fotoğrafı (isteğe bağlı – değeri okur)',t:'foto',ai:true},{k:'deger',l:'Ölçülen (°C)',t:'num',req:true}],
      aiPrompt:()=>'Fotoğrafta bir termometre, prob termometre veya soğutucu dolap sıcaklık göstergesi var. Göstergede okunan sıcaklık değerini ver. Eksi işaretine dikkat et. Yalnız şu JSON nesnesini döndür: {"deger": sayı (°C) | null, "uyari": "okunamıyorsa veya gösterge belirsizse kısa Türkçe açıklama" | null}',

  const csv='﻿'+lines.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');

}

let IDB = null;
function idbReq(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbTx(store, mode, fn){ return new Promise((res,rej)=>{ const tx=IDB.transaction(store,mode); const out=fn(tx.objectStore(store)); tx.oncomplete=()=>res(out instanceof IDBRequest?out.result:out); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
async function openLocal(){
  IDB = await new Promise((res,rej)=>{ const r=indexedDB.open('etci-memet-haccp',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('docs'); r.result.createObjectStore('blobs'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const init={};
  await new Promise((res,rej)=>{ const tx=IDB.transaction('docs','readonly'); const st=tx.objectStore('docs'); const c=st.openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ init[cur.key]=cur.value; cur.continue(); } else res(); }; c.onerror=()=>rej(c.error); });
  await new Promise((res,rej)=>{ const tx=IDB.transaction('blobs','readonly'); const c=tx.objectStore('blobs').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ LOCAL[cur.key]=URL.createObjectURL(cur.value); cur.continue(); } else res(); }; c.onerror=()=>rej(c.error); });
  db = memDB(init, { put:(p,v)=>idbTx('docs','readwrite',st=>st.put(JSON.parse(JSON.stringify(v)),p)), del:p=>idbTx('docs','readwrite',st=>st.delete(p)) });
  assets = { upload: async (blob) => { const id='L'+uid()+uid(); await idbTx('blobs','readwrite',st=>st.put(blob,id)); LOCAL[id]=URL.createObjectURL(blob); return {id, url:LOCAL[id], sizeBytes:blob.size, contentType:blob.type||'image/jpeg'}; } };
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
}

  const opt={margin:[10,10,10,10],image:{type:'jpeg',quality:0.9},html2canvas:{scale:1.6,backgroundColor:'#ffffff',useCORS:true,logging:false},jsPDF:{unit:'mm',format:'a4',orientation:orient==='landscape'?'landscape':'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','figure','.sign']}};
  let w=h2p().set(opt).from(mk(parts.pages[0])).toPdf();
  for(const pg of parts.pages.slice(1)) w=w.get('pdf').then(pdf=>{ pdf.addPage(); }).from(mk(pg)).toContainer().toCanvas().toPdf();
  return await w.outputPdf('blob');
}
async function savePdf(blob, fname, title){ return saveFile(blob,fname,title,'PDF'); }
async function saveFile(blob, fname, title, kind){
  if(downloads){ await downloads.save({filename:fname,data:blob}); return kind+' kaydedildi.'; }
  if(cap()&&cap().Filesystem){ const w=await cap().Filesystem.writeFile({path:fname,data:await b64(blob),directory:'CACHE'}); await cap().Share.share({title,text:'Etçi Memet HACCP – '+title,files:[w.uri],dialogTitle:'Gönder / aç'}); return kind+' hazırlandı ve paylaşıldı.'; }
  const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); return kind+' indirildi: '+fname;
}
async function doPdf(range, withFoto, msgKey){
  const [from,to,title]=range; S[msgKey]='PDF hazırlanıyor… (aylık raporda birkaç saniye sürebilir)'; render();
  const fname=`EtciMemet_HACCP_${title.replace(/[^A-Za-z0-9ğüşöçıİĞÜŞÖÇ]+/g,'_')}.pdf`;
  try{ const parts=await buildReport(from,to,title,withFoto,true); const blob=await makePdf(parts); S[msgKey]=await savePdf(blob,fname,title); }
  catch(e){ console.warn(e); S[msgKey]=e&&e.code==='declined'?'Kaydetme iptal edildi.':(e&&String(e.message||e).toLowerCase().includes('cancel'))?'Paylaşım iptal edildi.':'PDF oluşturulamadı'+(e&&e.message==='lib'?' (PDF bileşeni yüklenemedi)':'')+'. “Ekranda gör” veya yazdırmayı deneyin.'; }
  render();
}
async function doReport(mode){
  if(mode==='pdf') return doPdf(rpRange(), !!(S.rp&&S.rp.foto), 'rpMsg');
  const [from,to,title]=rpRange(); S.rpMsg='Rapor hazırlanıyor…'; render();
  let html; try{ html=await buildReport(from,to,title,!!(S.rp&&S.rp.foto)); }catch(e){ console.warn(e); S.rpMsg='Rapor hazırlanamadı.'; render(); return; }
  const fname=`EtciMemet_HACCP_${title.replace(/[^A-Za-z0-9ğüşöçıİĞÜŞÖÇ]+/g,'_')}.html`;
  try{
    if(mode==='view'){ S.rpMsg=''; render(); openInfo(title,`<iframe id="rpFrame" style="width:100%;height:75vh;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>`,()=>{ $('#rpFrame').srcdoc=html; }); return; }
    if(mode==='print'){ const fr=document.createElement('iframe'); fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(fr); fr.onload=()=>{ setTimeout(()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){} setTimeout(()=>fr.remove(),60000); },300); }; fr.srcdoc=html; S.rpMsg='Yazdırma penceresi açıldı. “PDF olarak kaydet” ile PDF alabilirsiniz.'; render(); return; }
    if(downloads){ await downloads.save({filename:fname,data:html}); S.rpMsg='Rapor kaydedildi. Dosyayı açıp Yazdır → PDF olarak kaydet.'; }
    else if(cap()&&cap().Filesystem){ const w=await cap().Filesystem.writeFile({path:fname,data:html,directory:'CACHE',encoding:'utf8'}); await cap().Share.share({title,text:'Etçi Memet HACCP – '+title,files:[w.uri],dialogTitle:'Raporu gönder'}); S.rpMsg='Rapor paylaşıldı.'; }
    else { const u=URL.createObjectURL(new Blob([html],{type:'text/html'})); const a=document.createElement('a'); a.href=u; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000); S.rpMsg='Rapor indirildi: '+fname; }
  }catch(e){ S.rpMsg=e&&e.code==='declined'?'Kaydetme iptal edildi.':'Rapor kaydedilemedi.'; }
  render();
}

/* ---------- başlat ---------- */
async function start(){
  let realDb=null;
  if(!window.EM_LOCAL) for(let i=0;i<30&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  const C=window.claude;
  if(C&&C.use){ [realDb,downloads,userCap,assets,sampleFn]=await Promise.all(['db','downloads','user','assets','sample'].map(n=>C.use(n).catch(()=>null))); }
  if(sampleFn){ try{ const lm=await sampleFn.limits(); aiOK=!!(lm&&lm.images); }catch(e){ aiOK=false; } }
  if(userCap){ try{ S.uid=await userCap.id(); }catch(e){} try{ const ce=await userCap.canEdit(); const own=await userCap.isOwner(); S.canEdit=!!(ce||own); }catch(e){} }
  if(realDb){ db=realDb; S.mode='claude'; }
  else if(!window.claude){ try{ await openLocal(); S.mode='local'; }catch(e){ console.warn(e); db=memDB(); S.mode='demo'; } }
  else { db=memDB(); S.mode='demo'; }
  S.live=S.mode!=='demo';
  const timer=setTimeout(()=>{ S.loadNote='Veriye henüz ulaşılamadı; bağlantıyı kontrol edin. Gösterilenler eksik olabilir.'; render(); },10000);
  const done=()=>{ clearTimeout(timer); if(S.loadNote){ S.loadNote=''; } };
  db.collection('gun').orderBy('tarih','desc').limit(400).onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.days=o; if(!s.metadata.fromCache) done(); if(!$('#sheet').classList.contains('open')&&!kfTyping()) render(); }, e=>{ done(); S.loadNote='Kayıtlar okunamadı ('+e.code+').'; render(); });
  db.doc('ayar/genel').onSnapshot(s=>{ S.ayar=s.exists?s.data():{}; if(!$('#sheet').classList.contains('open')) render(); }, ()=>{});
  db.collection('df').orderBy('ts','desc').limit(300).onSnapshot(s=>{ S.df=s.docs.map(d=>d.data()); if(!$('#sheet').classList.contains('open')) render(); }, ()=>{});
  db.doc('ek5/guncel').onSnapshot(s=>{ S.ek5=s.exists?s.data():{}; if(S.view==='denetim'&&!$('#sheet').classList.contains('open')) render(); }, ()=>{});
  render();
}
function kfTyping(){ const a=document.activeElement; if(S.view==='kf'&&a&&a.matches&&a.matches('#main input:not([type=date])')){ a.addEventListener('blur',()=>setTimeout(()=>{ if(!kfTyping()) render(); },50),{once:true}); return true; } return false; }
render(); Promise.resolve().then(start).catch(e=>console.warn(e)).finally(()=>setTimeout(gelenDinle,300));
}

name: Tanıtım videosu – seslendirme

# Yalnız "tanitim" dalında çalışır; uygulama derlemesini etkilemez.
on:
  push:
    branches: [tanitim]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: edge-tts kur
        run: pip install -U edge-tts && edge-tts --version || true
      - name: Seslendir (Türkçe nöral sesler)
        run: |
          for v in tr-TR-EmelNeural; do
            d=out/$(echo $v | sed 's/tr-TR-//; s/Neural//' | tr 'A-Z' 'a-z'); mkdir -p $d
            for f in metin/*.txt kilavuz/*.txt; do
              n=$(basename "$f" .txt)
              for i in 1 2 3; do edge-tts --voice $v --rate=+6% --pitch=+2Hz -f "$f" --write-media $d/$n.mp3 && [ -s $d/$n.mp3 ] && break; sleep 5; done; [ -s $d/$n.mp3 ]
            done
          done
          ls -laR out
      - name: tanitim-ses dalına koy
        run: |
          cd out
          git init -q -b tanitim-ses
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Seslendirme ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:tanitim-ses

name: Derle ve yayınla (APK, Windows, Web)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: derle
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Sabit imza anahtarı (güncellemeler eskisinin üzerine kurulsun)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore
      - run: npm install --no-audit --no-fund
      - name: Android projesi
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: APK derle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk EtciMemet-HACCP.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: EtciMemet-HACCP.apk }

  windows:
    name: Windows kurulumu
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - shell: bash
        run: mkdir -p desktop/app && cp -r www/. desktop/app/
      - working-directory: desktop
        shell: bash
        run: npm install --no-audit --no-fund && npm pkg set version=1.0.${{ github.run_number }}
      - working-directory: desktop
        shell: bash
        run: npx electron-builder --win nsis --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - shell: bash
        run: cp desktop/dist/*.exe EtciMemet-HACCP-Kurulum.exe
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: EtciMemet-HACCP-Kurulum.exe }

  yayinla:
    name: Sürümü yayınla
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: GitHub sürümü (Releases)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=v1.0.${{ github.run_number }}
          gh release create "$TAG" out/EtciMemet-HACCP.apk out/EtciMemet-HACCP-Kurulum.exe \
            --repo "${{ github.repository }}" --title "Etçi Memet HACCP $TAG" --latest \
            --notes "Telefon: EtciMemet-HACCP.apk · Bilgisayar: EtciMemet-HACCP-Kurulum.exe · Web: https://${{ github.repository_owner }}.github.io/etci-memet-haccp/"
      - name: Web sürümü (gh-pages dalı)
        run: |
          mkdir site && cp -r www/. site/ && touch site/.nojekyll && cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Web sürümü ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
